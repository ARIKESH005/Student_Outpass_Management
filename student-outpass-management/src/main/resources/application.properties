# Render assigns PORT dynamically; fall back to 8081 for local dev
server.port=${PORT:8081}

# Aiven MySQL requires SSL; prefer using sslMode=REQUIRED in the JDBC URL when deploying to cloud
# Read DB connection from env vars; keep defaults for local dev only
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/outpass_management_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings for cloud MySQL
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Secret
jwt.secret=${JWT_SECRET:94f5757969e4a36b5ec632514bcbe3e85e1b764b88939c381f953047d3d82dbb}
jwt.expiration=${JWT_EXPIRATION:86400000}
