<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Requests - Outpass Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-brand"><i class="fa-solid fa-graduation-cap"></i> Student Portal</div>
            <nav class="sidebar-nav">
                <a href="student-dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="my-requests.html" class="active"><i class="fa-solid fa-clock-rotate-left"></i> My Requests</a>
            </nav>
            <div class="user-settings-wrapper">
                <button class="user-settings-btn">
                    <span><i class="fa-solid fa-gear"></i> Settings</span>
                    <i class="fa-solid fa-chevron-up" style="font-size: 0.75rem;"></i>
                </button>
                <div class="user-dropdown-menu">
                    <button class="user-dropdown-item danger" onclick="deleteAccount()"><i class="fa-solid fa-user-xmark"></i> Delete Account</button>
                    <button class="user-dropdown-item" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
                </div>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="header animate-fade-in">
                <div class="header-title">
                    <h2>My Requests</h2>
                    <p>Track the status of your outpass applications.</p>
                </div>
                <div class="header-actions">
                    <button class="theme-toggle" onclick="toggleTheme()"><i id="theme-icon" class="fa-solid fa-moon"></i></button>
                    <div class="user-info">
                        <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                        <span id="username-display">Student</span>
                    </div>
                </div>
            </header>
            
            <div class="content-card animate-fade-in" style="animation-delay: 0.1s;">
                <div class="card-header">
                    <h3><i class="fa-solid fa-clock-rotate-left" style="color:var(--primary); margin-right:8px;"></i> History</h3>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Reason</th>
                                <th>Out Date</th>
                                <th>Return Date</th>
                                <th>Parent Phone</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="my-requests-body">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/app.js"></script>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        const icon = document.getElementById('theme-icon');
        if(icon) icon.className = savedTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';

        document.addEventListener('DOMContentLoaded', () => {
            if(checkAuth('STUDENT')) {
                loadMyRequests();
            }
        });
    </script>
</body>
</html>
