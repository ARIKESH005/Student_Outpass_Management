<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Outpass Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <input id="nav-toggle" type="checkbox" class="nav-toggle" hidden>
    <label for="nav-toggle" class="mobile-menu-btn" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></label>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand"><i class="fa-solid fa-shield-halved"></i> Admin Panel</div>
            <ul class="nav-links">
                <li><a href="admin-dashboard.html" class="active"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
            </ul>
            <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <header class="header animate-fade-in">
                <div class="header-title">
                    <h2>Overview</h2>
                    <p>Manage and track outpass requests for your department.</p>
                </div>
                <div class="header-actions">
                    <button class="theme-toggle" onclick="toggleTheme()"><i id="theme-icon" class="fa-solid fa-moon"></i></button>
                    <div class="user-info">
                        <div class="user-avatar"><i class="fa-solid fa-user-tie"></i></div>
                        <span id="username-display">Admin</span>
                    </div>
                </div>
            </header>
            
            <!-- KPI Cards -->
            <div class="analytics-grid animate-fade-in" style="animation-delay: 0.1s;">
                <div class="kpi-card">
                    <div class="kpi-info">
                        <h3>Total Requests</h3>
                        <p id="kpi-total">0</p>
                    </div>
                    <div class="kpi-icon primary"><i class="fa-solid fa-layer-group"></i></div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-info">
                        <h3>Pending</h3>
                        <p id="kpi-pending">0</p>
                    </div>
                    <div class="kpi-icon warning"><i class="fa-solid fa-clock-rotate-left"></i></div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-info">
                        <h3>Approved</h3>
                        <p id="kpi-approved">0</p>
                    </div>
                    <div class="kpi-icon success"><i class="fa-solid fa-check-double"></i></div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-info">
                        <h3>Rejected</h3>
                        <p id="kpi-rejected">0</p>
                    </div>
                    <div class="kpi-icon danger"><i class="fa-solid fa-ban"></i></div>
                </div>
            </div>

            <!-- Charts & Data -->
            <div class="charts-grid animate-fade-in" style="animation-delay: 0.2s;">
                <div class="content-card">
                    <div class="card-header">
                        <h3><i class="fa-solid fa-list-check" style="color:var(--primary); margin-right:8px;"></i> Recent Requests</h3>
                        <div class="search-bar">
                            <i class="fa-solid fa-search"></i>
                            <input type="text" id="search-input" placeholder="Search student or reason..." onkeyup="filterTable()">
                        </div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Student</th>
                                    <th>Dept</th>
                                    <th>Reason</th>
                                    <th>Out Date</th>
                                    <th>Return Date</th>
                                    <th>Parent Phone</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="admin-requests-body">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="content-card">
                    <div class="card-header">
                        <h3><i class="fa-solid fa-chart-doughnut" style="color:var(--primary); margin-right:8px;"></i> Status Distribution</h3>
                    </div>
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/app.js"></script>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        const icon = document.getElementById('theme-icon');
        if(icon) icon.className = savedTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';

        document.addEventListener('DOMContentLoaded', () => {
            if(checkAuth('ADMIN')) {
                loadAllRequests();
            }
        });

        let myChart = null;
        function renderChart(data) {
            const ctx = document.getElementById('statusChart');
            if(!ctx) return;
            
            const pending = data.filter(r => r.status === 'PENDING').length;
            const approved = data.filter(r => r.status === 'APPROVED').length;
            const rejected = data.filter(r => r.status === 'REJECTED').length;

            if(myChart) myChart.destroy();
            
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const textColor = isDark ? '#f9fafb' : '#1f2937';

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Pending', 'Approved', 'Rejected'],
                    datasets: [{
                        data: [pending, approved, rejected],
                        backgroundColor: [
                            'rgba(245, 158, 11, 0.8)',
                            'rgba(16, 185, 129, 0.8)',
                            'rgba(239, 68, 68, 0.8)'
                        ],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: textColor } }
                    }
                }
            });
        }
    </script>
</body>
</html>
